services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus_care}
      POSTGRES_USER: ${POSTGRES_USER:-campus_care}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - campus-care-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campus_care} -d ${POSTGRES_DB:-campus_care}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campus-care-postgres:
